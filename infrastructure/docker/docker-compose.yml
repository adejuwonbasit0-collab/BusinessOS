name: nexos

networks:
  nexos_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  meilisearch_data:

# ── Backing services ─────────────────────────────────────────────────────────
# Host ports are overridable via .env so the stack never collides with
# services already running on the machine (e.g. a native PostgreSQL on 5432).
#   docker compose up -d                      -> postgres, redis, minio, meilisearch
#   docker compose --profile full up -d       -> the above + api, web, nginx
services:
  postgres:
    image: postgres:16-alpine
    container_name: nexos_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexos_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexos_pass}
      POSTGRES_DB: ${POSTGRES_DB:-nexos_db}
    ports: ["${POSTGRES_PORT:-5434}:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    networks: [nexos_network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexos_user} -d ${POSTGRES_DB:-nexos_db}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: nexos_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-nexos_redis_pass} --appendonly yes
    ports: ["${REDIS_PORT:-6380}:6379"]
    volumes: ["redis_data:/data"]
    networks: [nexos_network]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-nexos_redis_pass} ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 12

  # MinIO (S3-compatible object storage). Opt-in via `--profile storage`:
  # the upstream `minio/minio` image is not reachable from every registry
  # mirror, and nothing in the API uses object storage yet.
  minio:
    profiles: ["storage"]
    image: minio/minio:latest
    container_name: nexos_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-nexos_minio_user}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-nexos_minio_pass}
    ports: ["${MINIO_PORT:-9000}:9000", "${MINIO_CONSOLE_PORT:-9001}:9001"]
    volumes: ["minio_data:/data"]
    networks: [nexos_network]

  meilisearch:
    image: getmeili/meilisearch:v1.7
    container_name: nexos_meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_API_KEY:-nexos_meili_master_key}
      MEILI_NO_ANALYTICS: "true"
    ports: ["${MEILISEARCH_PORT:-7700}:7700"]
    volumes: ["meilisearch_data:/meili_data"]
    networks: [nexos_network]

  # ── Application tier ───────────────────────────────────────────────────────
  api:
    profiles: ["full"]
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      target: development
    container_name: nexos_api
    restart: unless-stopped
    env_file: ../../.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-nexos_user}:${POSTGRES_PASSWORD:-nexos_pass}@postgres:5432/${POSTGRES_DB:-nexos_db}
      REDIS_URL: redis://:${REDIS_PASSWORD:-nexos_redis_pass}@redis:6379
      QUEUE_REDIS_URL: redis://:${REDIS_PASSWORD:-nexos_redis_pass}@redis:6379
    ports: ["4000:4000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes: ["../../apps/api:/app/apps/api", "../../packages:/app/packages", "/app/node_modules"]
    working_dir: /app/apps/api
    networks: [nexos_network]

  web:
    profiles: ["full"]
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      target: development
    container_name: nexos_web
    restart: unless-stopped
    env_file: ../../.env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_APP_URL: http://localhost:3002
    ports: ["3002:3002"]
    depends_on: [api]
    volumes: ["../../apps/web:/app/apps/web", "../../packages:/app/packages", "/app/node_modules"]
    working_dir: /app/apps/web
    networks: [nexos_network]

  nginx:
    profiles: ["full"]
    image: nginx:alpine
    container_name: nexos_nginx
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on: [api, web]
    networks: [nexos_network]
